name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Install Android NDK & SDK Components
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

    - name: Grant Gradle Execution Permissions
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        else
          echo "Wrapper file not found at root, setting up local project wrapper..."
          gradle wrapper
          chmod +x gradlew
        }

    - name: Build Low-Latency Audio Core & APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Completed APK Installation File
      uses: actions/upload-artifact@v4
      with:
        name: DidawMidi-Application-Package
        path: app/build/outputs/apk/debug/app-debug.apk
